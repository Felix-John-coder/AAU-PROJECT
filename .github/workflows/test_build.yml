name: test_build
on:       
  push:
    branches:
      - main 
  workflow_dispatch:
    
permissions:
  contents: read 
  id-token: write
concurrency: 
  group: pipeline
  cancel-in-progress: false 
jobs:
  test: 
    runs-on: ubuntu-latest
    timeout-minutes: 2 
    steps:
      - name: checkout repo 
        uses:  actions/checkout@v4 #load repo to runner 
        with: 
          fetch-depth: 1
          ref: main 
      - name: setup node 
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: install dependency 
        run: npm ci
      - name: run linting 
        run:  npx eslint .  #linting source code 
      - name: check path 
        run: |
          pwd 
          ls
      - name: Run Unit Tests
        run: |
          cd src
          node dashboard.tests.js
      - name: system scan # security scan that check my file system for vulberabilities
        uses: aquasecurity/trivy-action@0.35.0
        with: 
          scan-type: 'fs'
          ignore-unfixed: true 
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 1 #fail the pipeline if vulnerability are found in the file system


  #=============
  # Build and push image to Docker Hub
  #=============
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate Docker image tags and OCI labels
      - name: Generate image metadata
        id: img_tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # Authenticate to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the image
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.img_tag.outputs.tags }}
          labels: ${{ steps.img_tag.outputs.labels }}
          cache-from: type=gha,scope=aau-project
          cache-to: type=gha,mode=max,scope=aau-project


